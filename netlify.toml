[build]
  command = "npx gatsby build"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "24.22.1"

## Rewrite image URLs marked with imgcdn=true to use Netlify Image CDN
[[redirects]]
  from = "/*"
  query = {imgcdn = "true"}
  to = "/.netlify/images?url=/:splat&fm=webp"
  status = 200
  force = true
